version: "3.9"

services:
  app:
    build: .
    container_name: ai-code-reporter
    restart: always
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./repos:/app/repos
    ports:
      - "8000:8000"

